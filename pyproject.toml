[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "supportops-ai-platform"
version = "0.1.0"
description = "A production-minded AI support operations platform."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [
    { name = "Felipe Godoy" },
]
keywords = [
    "ai-engineering",
    "backend-engineering",
    "fastapi",
    "postgresql",
    "qdrant",
    "support-operations",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "alembic[tz]==1.18.5",
    "asyncpg==0.31.0",
    "fastapi==0.139.2",
    "pydantic==2.13.3",
    "pydantic-settings==2.14.2",
    "openai==2.52.0",
    "qdrant-client==1.18.0",
    "langgraph==1.2.10",
    "langgraph-checkpoint-postgres==3.1.1",
    "psycopg[binary,pool]==3.3.4",
    "sqlalchemy[asyncio]==2.0.51",
    "uvicorn==0.50.2",
    "tiktoken==0.13.0",
    "langfuse==4.14.2",
]

[project.scripts]
supportops-worker = "supportops.worker.main:main"
supportops-evaluate-classification = "supportops.evaluation.ticket_classification.cli:main"
supportops-index-knowledge = "supportops.knowledge_index.cli:main"
supportops-graph-checkpoints = "supportops.agent_graph.cli:main"

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==2.3.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/supportops"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["supportops"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true
pretty = true
show_error_codes = true
show_error_context = true
warn_unreachable = true
exclude = [
    "^alembic/versions/",
]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "--import-mode=importlib",
    "--strict-config",
    "--strict-markers",
    "-ra",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: tests that require external infrastructure services",
]
